{% extends "admin/challenges/update.html" %}
{% block category %}
<div class="form-group">
    <label>
        Category<br>
        <small class="form-text text-muted">Challenge Category</small>
    </label>
    <input type="text" class="form-control chal-category" name="category" value="{{ challenge.category }}">
</div>
<div class="form-group">
    <label for="dockerhost_select">Docker Host:
        <small class="form-text text-muted">Changing host only affects new containers</small>
    </label>
    <select id="dockerhost_select" name="docker_host_id" class="form-control" required></select>
</div>
<div class="form-group">
    <label for="dockerimage_select" id="dockerimage_label">Docker Image:</label>
    <select id="dockerimage_select" name="docker_image" class="form-control" required></select>
</div>
{% endblock %}
{% block footer %}
<script>
var DOCKER_IMAGE = {{ challenge.docker_image | tojson }};
var DOCKER_HOST_ID = {{ (challenge.docker_host_id or '') | tojson }};
</script>
{% endblock %}
